<!doctype html><meta charset="utf-8">
<!-- Pannello Twitch "Partner" per canale cliente, nello stile del suo canale. 640x256 (2x del pannello 320x128). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=JetBrains+Mono:wght@700&display=block"><style>
*{margin:0;box-sizing:border-box}
:root{--bg:#121212;--ink:#f2f0ec;--fire:#ff4d12}
html,body{width:640px;height:256px;overflow:hidden;background:var(--bg);color:var(--ink)}
body::before{content:"";position:absolute;inset:0;
 background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/8px 8px,
            linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/8px 8px}
.glow{position:absolute;right:-42px;top:-22px;width:300px;height:300px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,77,18,.38),rgba(255,77,18,.08) 45%,transparent 68%)}
.ring{position:absolute;right:6px;top:8px;width:240px;height:240px}
.logo{position:absolute;right:76px;top:78px;width:100px;height:100px}
.logo{overflow:visible}
.c{position:absolute;left:40px;top:46px}
.tag{display:inline-block;background:var(--fire);color:var(--bg);
 font-family:"JetBrains Mono";font-weight:700;font-size:21px;letter-spacing:.3em;padding:6px 6px 6px 16px}
h1{margin-top:10px;font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-size:72px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.sub{margin-top:12px;font-family:"JetBrains Mono";font-weight:700;font-size:15px;letter-spacing:.06em;color:rgba(242,240,236,.6)}
.sub b{color:var(--fire)}
.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--fire),#ff8a3d 60%,var(--fire))}
</style>
